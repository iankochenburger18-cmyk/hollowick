version: "3.9"

services:
  app:
    build: .
    command: npm run start
    env_file: .env
    depends_on:
      - redis
    expose:
      - "3000"
    restart: unless-stopped

  worker:
    build: .
    command: npm run worker
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
