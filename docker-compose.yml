version: "3.9"

services:
  app:
    build: .
    command: npm run start
    env_file: .env
    depends_on:
      - postgres
      - redis
    expose:
      - "3000"
    restart: unless-stopped

  worker:
    build: .
    command: npm run worker
    env_file: .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: placeholder_user
      POSTGRES_PASSWORD: placeholder_password
      POSTGRES_DB: placeholder_dbname
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
